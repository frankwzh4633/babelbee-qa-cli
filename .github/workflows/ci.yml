name: BabelBee QA CLI CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and inspect distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          python tools/check_dist.py dist
      - name: Install wheel and run model-stub tests
        run: |
          python -m venv "$RUNNER_TEMP/qa-wheel"
          . "$RUNNER_TEMP/qa-wheel/bin/activate"
          python -m pip install "$(printf '%s' dist/*.whl)[test]"
          python -m pip check
          babelbee-qa --help
          python -m pytest -q
      - name: Install source distribution in a separate environment
        if: matrix.python-version == '3.12'
        run: |
          python -m venv "$RUNNER_TEMP/qa-source"
          . "$RUNNER_TEMP/qa-source/bin/activate"
          python -m pip install "$(printf '%s' dist/*.tar.gz)[test]"
          python -m pip check
          babelbee-qa --help
          python -m pytest -q
      - name: Save verified distributions for review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qa-cli-dist-py${{ matrix.python-version }}
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
