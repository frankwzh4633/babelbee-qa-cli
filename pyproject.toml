[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "babelbee-qa"
version = "0.1.1"
description = "Local translation quality checks with a user-configured AI model"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["defusedxml>=0.7.1,<1", "openpyxl>=3.1.5,<4"]

[project.scripts]
babelbee-qa = "babelbee_qa.cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["babelbee_qa"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
